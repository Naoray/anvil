name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.24'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_amd64
            goos: linux
            goarch: amd64
            zip_extension: tar.gz
          - os: ubuntu-latest
            target: linux_arm64
            goos: linux
            goarch: arm64
            zip_extension: tar.gz
          - os: macos-latest
            target: darwin_amd64
            goos: darwin
            goarch: amd64
            zip_extension: tar.gz
          - os: macos-latest
            target: darwin_arm64
            goos: darwin
            goarch: arm64
            zip_extension: tar.gz
          - os: windows-latest
            target: windows_amd64
            goos: windows
            goarch: amd64
            binary_ext: .exe
            zip_extension: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          TARGET: ${{ matrix.target }}
          BINARY_EXT: ${{ matrix.binary_ext }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -trimpath -ldflags "-X main.Version=$VERSION -X main.Commit=$COMMIT -X main.BuildDate=$DATE" \
            -o "anvil-$VERSION-$TARGET$BINARY_EXT" ./cmd/anvil

      - name: Create archive (tar.gz)
        if: matrix.zip_extension == 'tar.gz'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          TARGET: ${{ matrix.target }}
          ZIP_EXTENSION: ${{ matrix.zip_extension }}
          BINARY_EXT: ${{ matrix.binary_ext }}
        run: tar -czf "anvil-$VERSION-$TARGET.$ZIP_EXTENSION" "anvil-$VERSION-$TARGET$BINARY_EXT"

      - name: Create archive (zip)
        if: matrix.zip_extension == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          TARGET: ${{ matrix.target }}
        run: |
          $version = $env:VERSION
          $target = $env:TARGET
          7z a "anvil-$version-$target.zip" "anvil-$version-$target.exe"

      - name: Generate checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          TARGET: ${{ matrix.target }}
          ZIP_EXTENSION: ${{ matrix.zip_extension }}
        run: sha256sum "anvil-$VERSION-$TARGET.$ZIP_EXTENSION" > "anvil-$VERSION-$TARGET.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anvil-${{ matrix.target }}
          path: |
            anvil-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.${{ matrix.zip_extension }}
            anvil-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.sha256

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags with annotations
        run: git fetch --tags --force

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Get previous tag
        id: previous_tag
        env:
          CURRENT_TAG: v${{ steps.version.outputs.VERSION }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)
          echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Build release body
        id: release_body
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          PREVIOUS: ${{ steps.previous_tag.outputs.PREVIOUS }}
          REPOSITORY: ${{ github.repository }}
        run: |
          CURRENT="v$VERSION"
          BODY_PATH=$(mktemp "$RUNNER_TEMP/anvil-release-body.XXXXXX")
          git cat-file tag "$CURRENT" | sed '1,/^$/d' > "$BODY_PATH"
          if [ -n "$PREVIOUS" ]; then
            printf '\n\n**Full changelog:** [%s..%s](https://github.com/%s/compare/%s..%s)\n' \
              "$PREVIOUS" "$CURRENT" "$REPOSITORY" "$PREVIOUS" "$CURRENT" >> "$BODY_PATH"
          fi
          echo "BODY_PATH=$BODY_PATH" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums file
        run: |
          cd release-artifacts
          cat *.sha256 > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          body_path: ${{ steps.release_body.outputs.BODY_PATH }}
          files: release-artifacts/*

      - name: Trigger Homebrew formula update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api repos/naoray/homebrew-tap/dispatches \
            --method POST \
            --field event_type=update-formula \
            --field "client_payload[version]=$VERSION" \
            --field "client_payload[repository]=$REPOSITORY"
